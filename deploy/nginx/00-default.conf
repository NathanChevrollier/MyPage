# /etc/nginx/sites-available/00-default
# Catch-all for requests that match no server_name (bare IP, unknown hostnames).
# Before this file, nginx fell back to the first vhost alphabetically (bformation, retiré
# depuis), which served its certificate for the apex and a 404 over HTTP.
# C'est aussi ce vhost qui répond pour les anciens sous-domaines supprimés
# (pma, clickneat, bformation, appvuejs, algocluck, devapi) tant que leur DNS pointe ici.
#
# Every existing vhost declares an explicit server_name, so none is affected.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 301 https://chevrolliernathan.fr$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    # Refuse the TLS handshake instead of presenting an unrelated certificate
    # (nginx >= 1.19.4; the VPS runs 1.22.1). No certificate needed.
    ssl_reject_handshake on;
}
