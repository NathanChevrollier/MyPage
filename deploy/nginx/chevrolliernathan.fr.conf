# /etc/nginx/sites-available/chevrolliernathan.fr
# Apex showcase site -> Docker container on 127.0.0.1:3100.
# Certificate: certbot (nginx authenticator, like the other vhosts), cert name "chevrolliernathan.fr".

# HTTP -> HTTPS on the apex (certbot's nginx authenticator injects its own
# challenge handling during issuance/renewal, no webroot needed).
server {
    listen 80;
    listen [::]:80;
    server_name chevrolliernathan.fr www.chevrolliernathan.fr;
    return 301 https://chevrolliernathan.fr$request_uri;
}

# www -> apex.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.chevrolliernathan.fr;

    ssl_certificate /etc/letsencrypt/live/chevrolliernathan.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chevrolliernathan.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://chevrolliernathan.fr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chevrolliernathan.fr;

    ssl_certificate /etc/letsencrypt/live/chevrolliernathan.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chevrolliernathan.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Only this vhost; the shared nginx.conf is left untouched. No includeSubDomains:
    # devapi.chevrolliernathan.fr is still HTTP-only and would become unreachable.
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/chevrolliernathan.fr.access.log;
    error_log /var/log/nginx/chevrolliernathan.fr.error.log warn;

    client_max_body_size 1k;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
