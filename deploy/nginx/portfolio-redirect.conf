# Replacement for /etc/nginx/sites-available/portfolio.chevrolliernathan.fr.conf
# once the new site is live: the old PHP portfolio redirects to the apex.
server {
    listen 80;
    server_name portfolio.chevrolliernathan.fr;
    return 301 https://chevrolliernathan.fr/;
}

server {
    listen 443 ssl http2;
    server_name portfolio.chevrolliernathan.fr;

    ssl_certificate /etc/letsencrypt/live/portfolio.chevrolliernathan.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.chevrolliernathan.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Old pages (index.php, projet.php, …) all map to the new home page.
    return 301 https://chevrolliernathan.fr/;
}
