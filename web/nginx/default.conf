# In-container nginx for the prerendered site. TLS and HSTS are handled by the
# host's nginx reverse proxy; this server only listens on the Docker network.

map $uri $cache_control {
    ~^/assets/          "public, max-age=31536000, immutable";
    ~^/media/           "public, max-age=2592000";
    ~^/models/          "public, max-age=2592000";
    ~\.(?:svg|png|ico|webmanifest|txt|xml|pdf)$ "public, max-age=86400";
    default             "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/xml model/gltf-binary;

    # Docker's embedded DNS, so nginx starts even if `status` is not up yet.
    resolver 127.0.0.11 valid=30s ipv6=off;

    include /etc/nginx/snippets/headers.conf;

    location = /api/status {
        set $status_upstream http://status:3101;
        proxy_pass $status_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        # Serve the last good answer while the service restarts.
        proxy_intercept_errors on;
        error_page 502 503 504 = @status_unavailable;
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=30" always;
    }

    location @status_unavailable {
        default_type application/json;
        return 503 '{"error":"status service unavailable"}';
    }

    location /api/ {
        return 404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Old portfolio PHP URLs and common typos land on the home page.
    location ~ \.php$ {
        return 301 /;
    }

    location /en/ {
        try_files $uri $uri/index.html $uri.html =404;
        error_page 404 /en/404/index.html;
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control $cache_control always;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
        error_page 404 /404/index.html;
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control $cache_control always;
    }

    location = /404/index.html {
        internal;
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /en/404/index.html {
        internal;
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The SPA fallback is never needed: every route is prerendered.
    location = /__spa-fallback.html {
        return 404;
    }
}
